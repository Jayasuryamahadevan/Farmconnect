<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="FarmConnect — Hyperlocal 3km farm-to-consumer marketplace. Get fresh produce directly from farmers near you in real-time.">
  <meta name="theme-color" content="#2D7A4F">
  <title>FarmConnect — Farm to You in 3 KM</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>

  <!-- App Shell -->
  <div id="app-shell">

    <!-- Top Header (hidden on auth screens) -->
    <header id="app-header" class="app-header hidden">
      <div class="header-left">
        <div class="logo-leaf">🌿</div>
        <div class="header-brand">FarmConnect</div>
      </div>
      <div class="header-right">
        <!-- Cart (consumer only — shown/hidden by ConsumerView) -->
        <button id="cart-btn" class="icon-btn hidden" onclick="ConsumerView._showCart()" aria-label="Cart">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
          </svg>
          <span id="cart-badge" class="notif-badge hidden">0</span>
        </button>
        <button id="notification-btn" class="icon-btn" onclick="NotificationsView.show()" aria-label="Notifications">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
          <span id="notif-badge" class="notif-badge hidden">0</span>
        </button>
        <div id="user-avatar" class="user-avatar" onclick="App.showProfile()" title="Profile"></div>
      </div>
    </header>


    <!-- Main Scrollable Content -->
    <main id="app-content" class="app-content"></main>

    <!-- Bottom Navigation (hidden on auth screens) -->
    <nav id="bottom-nav" class="bottom-nav hidden"></nav>

  </div>

  <!-- Toast Notifications -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Modal / Bottom Sheet -->
  <div id="modal-container"></div>

  <!-- Scripts — order matters (dependencies first) -->
  <!-- Data Files (loaded first so store can use them) -->
  <script src="data/farmers.data.js"></script>
  <script src="js/store.js"></script>

  <script src="js/geo.js"></script>
  <script src="js/matching.js"></script>
  <script src="js/agent.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/components/toast.js"></script>
  <script src="js/components/modal.js"></script>
  <script src="js/components/navbar.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/views/auth.view.js"></script>
  <script src="js/views/consumer.view.js"></script>
  <script src="js/views/farmer.view.js"></script>
  <script src="js/views/orders.view.js"></script>
  <script src="js/views/notifications.view.js"></script>
  <!-- Migration: clear old v1 seed so new farmer JSON is loaded -->
  <script>
    if (localStorage.getItem('fc_seeded') && !localStorage.getItem('fc_seeded_v2')) {
      // Preserve session across reseed
      const session = localStorage.getItem('fc_current_user');
      ['fc_seeded','fc_users','fc_products','fc_orders','fc_notifications'].forEach(k => localStorage.removeItem(k));
      if (session) localStorage.setItem('fc_current_user', session);
    }
  </script>
  <script src="js/app.js"></script>

</body>
</html>
